<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#0c1110"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Mojdei"/>
  <title>Mojdei</title>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="icon" href="icon.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="icon-180.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css?v=9"/>
  <style>
    .view{display:none!important}
    .view.on{display:block!important}
  </style>
</head>
<body>
  <div id="app">
    <header class="top" id="topBar">
      <div class="brand">Moj<span>dei</span></div>
      <nav class="tabs" id="navTabs">
        <button type="button" data-view="home" class="on" id="navHome">تمرین‌ها</button>
        <button type="button" data-view="edit" id="tabEdit" hidden>ویرایش</button>
      </nav>
    </header>

    <main>
      <section id="view-home" class="view on">
        <button type="button" class="btn primary sm" id="btnNewWod">جدید</button>
        <ul id="wodList" class="list"></ul>
      </section>

      <section id="view-edit" class="view">
        <div class="card">
          <h3>زمان‌بندی</h3>
          <div class="grid2">
            <label class="lbl">تمرین (ثانیه)
              <input id="defWork" type="number" min="5" max="600" value="40"/>
            </label>
            <label class="lbl">استراحت (ثانیه)
              <input id="defRest" type="number" min="0" max="300" value="20"/>
            </label>
          </div>
        </div>
        <div class="card">
          <h3>حرکات این تمرین</h3>
          <form id="moveForm" class="row-form">
            <input id="moveName" type="text" placeholder="نام حرکت جدید" required maxlength="60"/>
            <button type="submit" class="btn primary sm">افزودن به تمرین</button>
          </form>
          <p class="hint">نام را بنویس و بزن؛ همان لحظه به همین تمرین اضافه می‌شود. برای دوباره استفاده، از دکمه‌های زیر بزن.</p>
          <div id="pickMoves" class="chips"></div>
          <ol id="seqList" class="seq"></ol>
        </div>
        <div class="actions">
          <button type="button" class="btn primary block sm" id="btnSaveWod">ذخیره</button>
          <button type="button" class="btn ghost block sm" id="btnCancelEdit">انصراف</button>
        </div>
      </section>

      <section id="view-run" class="view run">
        <div class="run-meta">
          <span id="runProgress"></span>
        </div>
        <div id="phaseBadge" class="phase work">تمرین</div>
        <h2 id="curMove" class="cur-move">—</h2>
        <p id="nextMove" class="next-move">بعدی: —</p>
        <div class="clock-wrap">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="54" class="ring-bg"/>
            <circle cx="60" cy="60" r="54" class="ring-fg" id="ringFg"/>
          </svg>
          <div class="clock">
            <div id="elapsed" class="elapsed">0:00</div>
            <div id="target" class="target">/ 0:40</div>
          </div>
        </div>
        <div class="run-actions">
          <button type="button" class="btn big" id="btnPause">توقف</button>
          <button type="button" class="btn big primary" id="btnSkip">بعدی</button>
          <button type="button" class="btn big danger" id="btnStop">پایان</button>
        </div>
        <ol id="runQueue" class="run-queue"></ol>
      </section>

      <section id="view-done" class="view">
        <h2 class="done-title">تمام شد</h2>
        <button type="button" class="btn primary block sm" id="btnBackHome">بازگشت</button>
      </section>
    </main>
  </div>
  <script src="app.js?v=9"></script>
  <script>
    document.getElementById("btnNewWod").addEventListener("click", function () {
      if (window.Mojdei && typeof window.Mojdei.newWod === "function") {
        window.Mojdei.newWod();
      }
    });
  </script>
</body>
</html>
